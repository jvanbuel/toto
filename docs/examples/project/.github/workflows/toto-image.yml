# Builds the environment image and publishes it where `.devcontainer/toto/devcontainer.json` points.
name: toto image
on:
  push:
    branches: [main]
    paths: [environment/**]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: environment
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/toto-env:1.0
