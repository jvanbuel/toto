# Builds the dev container image with the spec's reference CLI and publishes it where
# `.devcontainer/devcontainer.json` names it (customizations.toto.image). Contributors then pull
# that image instead of prebuilding on their own machines.
name: toto image
on:
  push:
    branches: [main]
    paths: [.devcontainer/**]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install -g @devcontainers/cli
      - run: devcontainer build --workspace-folder . --image-name ghcr.io/${{ github.repository_owner }}/toto-env:1.0 --push
