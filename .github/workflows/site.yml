# Builds the directory site (site/, SvelteKit, prerendered) from directory/projects.json and
# publishes it to GitHub Pages. Runs whenever the directory or the site changes. Enable Pages
# with "GitHub Actions" as the source once in the repository settings.
name: site
on:
  push:
    branches: [main]
    paths: [site/**, directory/**, .github/workflows/site.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # The site lives under /<repository name>/ on project Pages.
      - run: npm run build
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
