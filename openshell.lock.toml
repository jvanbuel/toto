# The OpenShell release toto ships with and runs as its sandbox (ADR 17). toto installs nothing
# that does not match this file. Update it with `scripts/pin-openshell.sh <version>` and run the
# live tests (docs/spikes/openshell.md) before releasing.
version = "0.1.5"
release_url = "https://github.com/NVIDIA/OpenShell/releases/download/v0.1.5"

# Trusted images the gateway runs next to every workload, pinned by (multi-arch index) digest.
[images]
supervisor = "ghcr.io/nvidia/openshell/supervisor@sha256:fabcd01f656e9d23df4386f82e80b4f48b90f3452d7d5c58889007643a069161"
sandbox_runtime = "ghcr.io/nvidia/openshell/sandbox@sha256:e9adf9ecde328122414ad2ee8c6fc5d5b389e4cf168daf4357c46f5a77d55851"

# Release archives per platform (`<arch>-<os>`), each holding one binary. `sha256` is the
# archive's; empty means not yet pinned, and toto then refuses to install it.
[binaries.x86_64-linux]
openshell = { asset = "openshell-x86_64-unknown-linux-musl.tar.gz", sha256 = "" }
openshell-gateway = { asset = "openshell-gateway-x86_64-unknown-linux-gnu.tar.gz", sha256 = "" }
openshell-driver-vm = { asset = "openshell-driver-vm-x86_64-unknown-linux-gnu.tar.gz", sha256 = "" }

[binaries.aarch64-linux]
openshell = { asset = "openshell-aarch64-unknown-linux-musl.tar.gz", sha256 = "" }
openshell-gateway = { asset = "openshell-gateway-aarch64-unknown-linux-gnu.tar.gz", sha256 = "" }
openshell-driver-vm = { asset = "openshell-driver-vm-aarch64-unknown-linux-gnu.tar.gz", sha256 = "" }

[binaries.aarch64-macos]
openshell = { asset = "openshell-aarch64-apple-darwin.tar.gz", sha256 = "" }
openshell-gateway = { asset = "openshell-gateway-aarch64-apple-darwin.tar.gz", sha256 = "" }
openshell-driver-vm = { asset = "openshell-driver-vm-aarch64-apple-darwin.tar.gz", sha256 = "" }
