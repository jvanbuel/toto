[package]
name = "toto-runner"
version = "0.1.0"
edition = "2024"

[lib]
name = "toto"

[[bin]]
name = "toto"
path = "src/main.rs"

[workspace]
members = []

[dependencies]
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }
hex = "0.4.3"
rand = "0.8"
rpassword = "7.5.4"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
